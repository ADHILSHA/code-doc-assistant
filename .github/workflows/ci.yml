name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,embeddings]"
      - name: Ruff
        run: ruff check app tests
      - name: Mypy
        run: mypy app
      - name: Pytest
        # Zero network calls — every test uses FakeEmbeddingProvider /
        # FakeLLMProvider (SPEC.md §7.2), so no API keys are needed here.
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  eval-mini-repo:
    # SPEC.md §6 Phase 4 task 5: "Add a CI job running the eval on the
    # smallest fixture repo." Unlike backend-tests, this makes real API
    # calls (routing's LLM fallback, reranking, the agent loop, hierarchical
    # summarization, and the LLM-as-judge correctness score all need a real
    # model) — add ANTHROPIC_API_KEY and VOYAGE_API_KEY as repository
    # secrets (Settings -> Secrets and variables -> Actions) for this job
    # to actually run. It's skipped (not failed) when they're absent, so a
    # fork or a repo that hasn't configured them yet still gets a green
    # backend-tests/frontend build.
    runs-on: ubuntu-latest
    needs: backend-tests
    if: ${{ secrets.ANTHROPIC_API_KEY != '' && secrets.VOYAGE_API_KEY != '' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,embeddings]"
      - name: Run eval against mini_repo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          ALLOW_LOCAL_REPOS: "true"
        run: python -m app.eval.run_eval --repo mini_repo
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-mini-repo
          path: eval/report/
