[project]
name = "code-doc-assistant-backend"
version = "0.1.0"
description = "Backend for the Code Documentation Assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "anthropic>=0.40",
  "sqlite-vec>=0.1.6",
  "sse-starlette>=2.1",
  "pathspec>=0.12",
]

[project.optional-dependencies]
# Real embedding adapters. `fastembed` runs a local ONNX model — no API key,
# works offline, good default for dev/demo. voyageai/openai require keys.
embeddings = [
  "fastembed>=0.4",
  "voyageai>=0.3",
  "openai>=1.50",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/fixtures/mini_repo is fixture *data* (it has its own test_service.py
# that exercises the fixture's own fake `src` package) — never collect it as
# part of our real suite.
norecursedirs = ["fixtures"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
# Match the project's declared floor (requires-python above), not whichever
# interpreter happens to run locally.
target-version = "py311"
# tests/fixtures/mini_repo is fixture *data* meant to look like real foreign
# code (including a fake generated protobuf file) — it's deliberately not
# written to our own style rules.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)` default-argument pattern is the documented,
# required way to declare dependencies — not the mutable-default footgun
# B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["tests/fixtures"]
