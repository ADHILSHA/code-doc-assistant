[project]
name = "code-doc-assistant-backend"
version = "0.1.0"
description = "Backend for the Code Documentation Assistant"
# 3.12 floor: numpy's type stubs (pulled in transitively by voyageai) use
# PEP 695 syntax that mypy can only parse when targeting 3.12+, regardless
# of the syntax our own code uses. See DECISIONS.md for the full story
# (this constraint was first found via a since-removed fastembed/onnxruntime
# dependency, but holds independently of that).
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "anthropic>=0.40",
  "sqlite-vec>=0.1.6",
  "sse-starlette>=2.1",
  "pathspec>=0.12",
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Real embedding adapters — both require an API key (VOYAGE_API_KEY /
# OPENAI_API_KEY respectively). voyage-code-3 is the default (SPEC.md §2).
embeddings = [
  "voyageai>=0.3",
  "openai>=1.50",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/fixtures/mini_repo is fixture *data* (it has its own test_service.py
# that exercises the fixture's own fake `src` package) — never collect it as
# part of our real suite.
norecursedirs = ["fixtures"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
# Match the project's declared floor (requires-python above), not whichever
# interpreter happens to run locally.
target-version = "py312"
# tests/fixtures/mini_repo is fixture *data* meant to look like real foreign
# code (including a fake generated protobuf file) — it's deliberately not
# written to our own style rules.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)` default-argument pattern is the documented,
# required way to declare dependencies — not the mutable-default footgun
# B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["tests/fixtures"]
