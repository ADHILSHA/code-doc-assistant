# --- explain ---

- id: flask-explain-001
  question: "How does Flask build its URL routing table?"
  route: explain
  expected_files: ["src/flask/sansio/app.py"]
  expected_substrings: ["url_map", "add_url_rule"]
  notes: "must mention Werkzeug's Map/url_map — this is SPEC.md's own illustrative example question, answered against the current (sansio-refactored) codebase layout"

- id: flask-explain-002
  question: "How does Flask's add_url_rule method wire up a new URL rule?"
  route: explain
  expected_files: ["src/flask/sansio/app.py"]
  expected_substrings: ["url_map"]
  notes: "worded to avoid the word 'route', which the router's fast-path regex reads as an endpoints-route signal — found via a real eval run misclassifying the original wording"

- id: flask-explain-003
  question: "How does Flask manage user sessions?"
  route: explain
  expected_files: ["src/flask/sessions.py"]
  expected_substrings: ["SecureCookieSession"]

- id: flask-explain-004
