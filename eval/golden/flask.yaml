# Golden question set for pallets/flask (SPEC.md §6 Phase 4 task 1, §8's
# first recommended real test repo). Ground truth verified directly against
# a real shallow clone (flask 3.2.0.dev, main branch) — not guessed from
# memory. Note the routing internals live in src/flask/sansio/app.py (a
# 3.1+ refactor split Flask's App class into a transport-agnostic "sansio"
# base + a WSGI-specific src/flask/app.py subclass) — SPEC.md's own
# illustrative example question ("Where is the routing table built?" ->
# src/flask/app.py) predates that refactor; the correct current answer is
# sansio/app.py, which is what's used below. 4 questions per route, 20 total.

# --- locate ---

- id: flask-locate-001
  question: "Where is the Flask class defined?"
  route: locate
  expected_files: ["src/flask/app.py"]
  expected_substrings: ["class Flask"]

- id: flask-locate-002
  question: "Where is add_url_rule defined?"
  route: locate
  expected_files: ["src/flask/sansio/app.py"]
  expected_substrings: ["add_url_rule"]
  notes: "add_url_rule also exists on Blueprint (sansio/blueprints.py) and Scaffold (sansio/scaffold.py) — the App-level definition in sansio/app.py is the primary one expected here"

- id: flask-locate-003
  question: "Where is the Config class defined?"
  route: locate
  expected_files: ["src/flask/config.py"]
  expected_substrings: ["class Config"]

- id: flask-locate-004
  question: "Where is the Blueprint class defined?"
  route: locate
  expected_files: ["src/flask/sansio/blueprints.py"]
  expected_substrings: ["class Blueprint"]
  notes: "src/flask/blueprints.py re-exports a thin WSGI-specific subclass; the real implementation is in sansio/blueprints.py"

