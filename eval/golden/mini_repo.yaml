  expected_substrings: ["UserService"]

- id: mini-locate-002
  question: "Where is hash_password defined?"
  route: locate
  expected_files: ["src/auth/auth.py"]
  expected_substrings: ["hash_password"]

- id: mini-locate-003
  question: "Where is the UserClient class defined?"
  route: locate
  expected_files: ["web/userClient.ts"]
  expected_substrings: ["UserClient"]

- id: mini-locate-004
  question: "Where is derive_key defined?"
  route: locate
  expected_files: ["src/auth/crypto.py"]
  expected_substrings: ["derive_key"]
  notes: "derive_key is the low-level PBKDF2 primitive factored out of auth.py"

- id: mini-locate-005
