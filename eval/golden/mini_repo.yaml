  expected_substrings: ["pbkdf2", "hash_password"]
  notes: "case-insensitive match expected for PBKDF2"

- id: mini-explain-002
  question: "Trace what happens when create_user hashes a password, from the service call all the way down to the crypto primitive."
  route: explain
  expected_files: ["src/users/service.py", "src/auth/auth.py", "src/auth/crypto.py"]
  expected_substrings: ["derive_key", "hash_password"]
  notes: "a genuine 4-file chain (tests/test_service.py -> service.py -> auth.py -> crypto.py); answer should name at least the 3 src/ files"

